var MESES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function pad(n,l){return String(n).padStart(l||2,'0')}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function star(n,R,r){var p=[];for(var i=0;i<n*2;i++){var a=Math.PI*i/n,rad=i%2?r:R;p.push((32+rad*Math.cos(a)).toFixed(1)+','+(32+rad*Math.sin(a)).toFixed(1))}return p.join(' ')}

document.querySelector('.d1').innerHTML='<svg viewBox="0 0 64 64" class="spin-slow"><polygon points="'+star(12,31,18)+'"/></svg>';
document.querySelector('.d2').innerHTML='<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30"/><circle cx="32" cy="32" r="21"/><circle cx="32" cy="32" r="12"/></svg>';

var evs=EVENTOS.map(function(e){var p=e.fecha.split('-').map(Number);return Object.assign({},e,{y:p[0],m:p[1],d:p[2],t:new Date(p[0],p[1]-1,p[2]).getTime()})}).sort(function(a,b){return a.t-b.t});
var years=[];evs.forEach(function(e){if(years.indexOf(e.y)<0)years.push(e.y)});
document.getElementById('n').textContent=evs.length;

function band(pf,pt,k){
  var t='';for(var i=0;i<14;i++)t+=years[pt]+' → ';
  return '<div class="band-wrap" aria-hidden="true" style="--from:var(--p'+(pf%3)+');--to:var(--p'+(pt%3)+')"><div class="band'+(k%2?' rev':'')+'"><div class="track"><span>'+t+'</span><span>'+t+'</span></div></div></div>';
}

var html='<div class="spine" aria-hidden="true"><i></i></div>',gi=0;
years.forEach(function(y,yi){
  var list=evs.filter(function(e){return e.y===y});
  if(yi>0){html+=band(yi-1,yi,yi)}
  html+='<section class="year" style="--c:var(--p'+(yi%3)+')" data-yi="'+yi+'"><div class="year-head"><div class="wrap"><h2 class="year-num" aria-label="'+y+'">'+String(y).split('').map(function(ch){return '<span aria-hidden="true">'+ch+'</span>'}).join('')+'</h2><p class="year-meta">'+list.length+' '+(list.length===1?'momento':'momentos')+'</p></div></div><ol class="evs">';
  list.forEach(function(e){
    var side=gi%2?'r':'l';gi++;
    var src=e.foto||'';
    html+='<li class="ev '+side+'" data-t="'+e.t+'"><div class="node" aria-hidden="true"><b></b></div><article class="card"><figure class="foto'+(src?' has':'')+'"><img src="'+esc(src)+'" alt="'+esc(e.titulo)+'" decoding="async" referrerpolicy="no-referrer"></figure><div class="card-top"><span class="chip'+(e.hoy?' hoy':'')+'">'+(e.hoy?'Hoy · ':'')+e.d+' '+MESES[e.m-1]+'</span></div><h3>'+esc(e.titulo)+'</h3><p>'+esc(e.texto)+'</p></article></li>';
  });
  html+='</ol></section>';
});
var main=document.getElementById('tl');
main.innerHTML=html;

/* si una foto no carga (ruta mala), vuelve a verse el marcador */
[].forEach.call(main.querySelectorAll('.foto img'),function(im){
  var fig=im.parentNode;
  if(!im.getAttribute('src'))return;
  function ok(){im.classList.add('loaded');fig.classList.add('ok');fig.classList.remove('bad');fig.tabIndex=0;fig.setAttribute('role','button');fig.setAttribute('aria-label','Ver foto completa: '+im.alt)}
  function bad(){fig.classList.remove('ok');fig.classList.add('bad');fig.removeAttribute('tabindex');fig.removeAttribute('role');fig.removeAttribute('aria-label')}
  im.addEventListener('load',ok);
  im.addEventListener('error',bad);
  if(im.complete){if(im.naturalWidth)ok();else bad()}
});

/* ---------- visor de foto ---------- */
var lb=document.getElementById('lb'),lbImg=lb.querySelector('img'),lbCap=lb.querySelector('.lb-cap'),lbX=lb.querySelector('.lb-x'),lbFrom=null;
function openLb(fig){
  var im=fig.querySelector('img');
  lbFrom=fig;
  lbImg.src=im.currentSrc||im.src;
  lbImg.alt=im.alt;
  lbCap.textContent=im.alt;
  lb.classList.add('open');
  lb.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  lbX.focus();
}
function closeLb(){
  if(!lb.classList.contains('open'))return;
  lb.classList.remove('open');
  lb.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  lbImg.removeAttribute('src');
  if(lbFrom)lbFrom.focus({preventScroll:true});
}
main.addEventListener('click',function(e){
  var fig=e.target.closest&&e.target.closest('.foto.ok');
  if(fig)openLb(fig);
});
main.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var fig=e.target.closest&&e.target.closest('.foto.ok');
  if(fig&&e.target===fig){e.preventDefault();openLb(fig)}
});
lb.addEventListener('click',function(e){if(e.target!==lbImg)closeLb()});
document.addEventListener('keydown',function(e){
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  else if(e.key==='Tab'){e.preventDefault();lbX.focus()}
});

var hud=document.querySelector('.hud'),tcEl=document.getElementById('tc'),pctEl=document.getElementById('pct');
var spine=main.querySelector('.spine i');
var cards=[].slice.call(main.querySelectorAll('.ev'));
var secs=[].slice.call(main.querySelectorAll('.year'));
var T0=new Date(years[0],0,1).getTime();
var last=evs[evs.length-1];
var marks=[],tlTop=0,tlH=1,secInfo=[],docMax=1,raf=0;

function top(el){return el.getBoundingClientRect().top+window.scrollY}
function measure(){
  tlTop=top(main);tlH=Math.max(1,main.offsetHeight);
  marks=cards.map(function(c){return {y:top(c)+c.offsetHeight/2,t:+c.dataset.t}});
  secInfo=secs.map(function(s){return {top:top(s),h:s.offsetHeight,num:s.querySelector('.year-num'),digits:[].slice.call(s.querySelectorAll('.year-num span'))}});
  docMax=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);
}
function timeAt(y){
  var pts=[{y:tlTop,t:T0}].concat(marks,[{y:tlTop+tlH,t:last.t}]);
  if(y<=pts[0].y)return pts[0].t;
  for(var i=0;i<pts.length-1;i++){
    if(y<pts[i+1].y){var a=pts[i],b=pts[i+1],k=(y-a.y)/Math.max(1,b.y-a.y);return a.t+(b.t-a.t)*k}
  }
  return pts[pts.length-1].t;
}
function frame(){
  raf=0;
  var sy=window.scrollY,vh=window.innerHeight,yMid=sy+vh*.5;
  var p=clamp(sy/docMax,0,1);
  if(hud)hud.style.setProperty('--prog',p.toFixed(4));
  if(pctEl)pctEl.textContent=pad(Math.round(p*100),3);
  var t=timeAt(yMid),d=new Date(t);
  var yi=clamp(years.indexOf(d.getFullYear()),0,years.length-1);
  if(hud)hud.style.setProperty('--hc','var(--p'+(yi%3)+')');
  if(tcEl)tcEl.textContent=d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+(last.hoy&&t>=last.t-1?' · HOY':'');
  spine.style.setProperty('--s',clamp((yMid-tlTop)/tlH,0,1).toFixed(4));
  cards.forEach(function(c,i){c.classList.toggle('passed',marks[i]&&marks[i].y<yMid)});
  if(!reduce){
    secInfo.forEach(function(s){
      var q=clamp((yMid-(s.top+s.h/2))/(s.h/2+vh/2),-1,1);
      if(Math.abs(q)<1){
        s.num.style.setProperty('--dx',(q*-4).toFixed(2));
        s.digits.forEach(function(dg,i){dg.style.setProperty('--dy',(Math.sin(sy*.006+i*1.1)*7).toFixed(1)+'px')});
      }
    });
  }
}
function request(){if(!raf)raf=requestAnimationFrame(frame)}

if(!reduce&&'IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.remove('pre');io.unobserve(e.target)}})},{rootMargin:'0px 0px -10% 0px'});
  cards.forEach(function(li){
    var c=li.querySelector('.card');
    if(li.getBoundingClientRect().top>window.innerHeight*.9){c.classList.add('pre');io.observe(c)}
  });
}

measure();frame();
window.addEventListener('scroll',request,{passive:true});
window.addEventListener('resize',function(){measure();request()});
window.addEventListener('load',function(){measure();request()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){measure();request()});
document.getElementById('top').addEventListener('click',function(){window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})});
})();
</script>

</body>
</html>
